server {
    listen 80;
    server_name _;
    client_max_body_size 2G;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://gateway-api:8080/api/;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
